name: Track KV.ee Objects

on:
  schedule:
    - cron: "0 12 * * *"  # 12:00 UTC = 15:00 Tallinn
  workflow_dispatch:

jobs:
  track:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@11223a5885b234b2c85c0e87e6342944799145f2  # Последний коммит

      - name: Setup Python
        uses: actions/setup-python@0b970c42e458f79e7b3f49998a8842a88299a146  # Последний коммит
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip --no-cache-dir
          pip install requests beautifulsoup4 matplotlib --no-cache-dir

      - name: Run script
        run: python track_kv_ee.py

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@680512403922689343c2ae08355b8dd6859e4143  # Последний коммит
        with:
          commit_message: "Update KV.ee data"
          file_pattern: "data.json graph.png"
          commit_user_name: "GitHub Actions"
          commit_user_email: "actions@github.com"
