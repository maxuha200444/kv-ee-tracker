name: Track KV.ee Objects

on:
  schedule:
    - cron: "0 12 * * *"  # 12:00 UTC = 15:00 Tallinn
  workflow_dispatch:

jobs:
  track:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # ✅ Даём права на запись в репозиторий

    steps:
      - name: Checkout
        uses: actions/checkout@v4.1.7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}  # ✅ Используем токен с правами

      - name: Setup Python
        uses: actions/setup-python@v5.1.1
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 matplotlib

      - name: Run script
        run: python track_kv_ee.py

      - name: Commit and push changes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # ✅ Токен для git push
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add data.json graph.png
          git commit -m "Update KV.ee data" || echo "No changes to commit"
          git push origin HEAD:main || echo "Push skipped"
