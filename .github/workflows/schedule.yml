name: Track KV.ee Objects

on:
  schedule:
    - cron: "0 12 * * *"  # 12:00 UTC = 15:00 Tallinn
  workflow_dispatch:

jobs:
  track:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # ✅ Права на запись

    steps:
      - name: Checkout
        uses: actions/checkout@v4.1.7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5.1.1
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip --no-cache-dir
          pip install requests beautifulsoup4 matplotlib --no-cache-dir

      - name: Run script
        run: python track_kv_ee.py

      - name: Debug - Show files
        run: ls -la

      - name: Debug - Show data.json
        run: cat data.json || echo "data.json NOT FOUND"

      - name: Debug - Show graph.png
        run: ls -la graph.png || echo "graph.png NOT FOUND"

      # Используем специализированный action для коммита
      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update KV.ee data"
          file_pattern: "data.json graph.png"
          commit_user_name: "GitHub Actions"
          commit_user_email: "actions@github.com"
          commit_author: "GitHub Actions <actions@github.com>"
