name: Track KV.ee Objects

on:
  schedule:
    - cron: "0 12 * * *"  # 12:00 UTC = 15:00 Tallinn
  workflow_dispatch:  # Для ручного запуска

jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4.1.7  # Обновленная версия

      - name: Set up Python
        uses: actions/setup-python@v5.1.1  # Обновленная версия
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 matplotlib

      - name: Run script
        run: python track_kv_ee.py

      - name: Commit changes
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add data.json graph.png
          git commit -m "Update KV.ee data" || echo "No changes"
          git push
